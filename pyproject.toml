[project]
name = "indicrag"
version = "0.1.0"
description = "Hindi/Kannada/English RAG benchmark and reference system for Indian citizen-service documents"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12", "lxml>=5", "pymupdf>=1.23"]

[project.optional-dependencies]
render = ["playwright>=1.40"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741", "B905", "UP031", "E501", "E701", "E702", "B008", "UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E741"]
"scripts/week1_parse_spike.py" = ["E731", "B023", "B007"]
"scripts/licence_scan.py" = ["B007"]
